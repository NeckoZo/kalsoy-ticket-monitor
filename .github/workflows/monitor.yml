name: Monitor Kalsoy ferry tickets

on:
  schedule:
    # GitHub cron uses UTC. The Faroe Islands are UTC+1 during June/July.
    # Through June 28 local time: every 2 hours at :17.
    - cron: "17 1-23/2 24-27 6 *"
    - cron: "17 1-21/2 28 6 *"

    # June 29 through July 1 local time: every hour at :17.
    - cron: "17 23 28 6 *"
    - cron: "17 * 29-30 6 *"
    - cron: "17 0-22 1 7 *"

    # July 2 local time: every 30 minutes at :17 and :47.
    - cron: "17,47 23 1 7 *"
    - cron: "17,47 0-22 2 7 *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kalsoy-ticket-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore notification state
        id: state-cache
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state.json
          key: kalsoy-state-${{ github.run_id }}
          restore-keys: |
            kalsoy-state-

      - name: Check ticket availability
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          TARGET_DATE: "02. Jul. 2026"
          TARGET_DATE_API: "02072026"
          TARGET_TIMES: "08:00,09:00"
        run: python monitor.py

      - name: Save notification state
        if: always() && hashFiles('.monitor-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .monitor-state.json
          key: kalsoy-state-${{ github.run_id }}
