name: Monitor Kalsoy ferry tickets

on:
  schedule:
    # The public schedule contains no itinerary. The script enforces the actual
    # monitoring window and cadence from encrypted repository secrets.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kalsoy-ticket-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore notification state
        id: state-cache
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state.json
          key: kalsoy-state-${{ github.run_id }}
          restore-keys: |
            kalsoy-state-

      - name: Check ticket availability
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          BOOKING_URL: ${{ secrets.BOOKING_URL }}
          TARGET_DATE_ISO: ${{ secrets.TARGET_DATE_ISO }}
          OUTBOUND_TARGET_TIMES: ${{ secrets.OUTBOUND_TARGET_TIMES }}
          RETURN_TARGET_TIMES: ${{ secrets.RETURN_TARGET_TIMES }}
        run: python monitor.py

      - name: Save notification state
        if: always() && hashFiles('.monitor-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .monitor-state.json
          key: kalsoy-state-${{ github.run_id }}
